name: .NET Core Unit Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
        
    - name: Restore dependencies
      run: dotnet restore netcore/ExploringActions.sln
      
    - name: Build
      run: dotnet build netcore/ExploringActions.sln --no-restore --configuration Release
      
    - name: Test
      run: dotnet test netcore/TestExploringActions/TestExploringActions.csproj --no-build --verbosity normal
